<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>therealkiaus dome</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
 

<div class="topbar">
  <div class="logo">therealkiaus dome</div>
  <input id="search" placeholder="Search games..." oninput="renderGames()">
</div>

<div class="layout">

  <div class="sidebar">
    <button onclick="setCat('all')">Home</button>
    <button onclick="setCat('action')">Action</button>
    <button onclick="setCat('multiplayer')">Multiplayer</button>
    <button onclick="setCat('racing')">Racing</button>
    <button onclick="setCat('puzzle')">Puzzle</button>
    <button onclick="setCat('arcade')">Arcade</button>
  </div>

  <div class="content">
    <h2>Featured Games</h2>
    <div id="featured"></div>

    <h2>All Games</h2>
    <div id="grid"></div>
  </div>

</div>

<iframe id="frame"></iframe>

<script src="games.js"></script>
<script src="app.js"></script>
<style>
#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#050714;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
z-index:1000;
}
</style>
</body>
<div id="loader">Loading games...</div>
</html>
