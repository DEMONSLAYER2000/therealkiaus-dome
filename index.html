 <div class="tabs">

    <button onclick="showTab('apps')">Apps</button>
  </div>
</div>

  <input id="search" placeholder="Search games..." oninput="renderGames()">
</div>

<!-- GAMES -->
<div id="gamesTab">

  <div id="grid"></div>
